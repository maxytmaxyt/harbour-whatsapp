name: Build RPM

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SFOS_RELEASE: 5.0.0.43
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, armv7hl, i486 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RPMS-Verzeichnis anlegen
        run: mkdir -p RPMS

      - name: Build ${{ matrix.arch }} mit Sailfish SDK ${{ env.SFOS_RELEASE }}
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch:    ${{ matrix.arch }}

      - name: RPMs auflisten
        run: ls -lh RPMS/

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: harbour-whatsapp-${{ matrix.arch }}-rpm
          path: RPMS/*.rpm
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release erstellen
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Artefakte herunterladen (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: harbour-whatsapp-aarch64-rpm
          path: release-rpms

      - name: Artefakte herunterladen (armv7hl)
        uses: actions/download-artifact@v4
        with:
          name: harbour-whatsapp-armv7hl-rpm
          path: release-rpms

      - name: Artefakte herunterladen (i486)
        uses: actions/download-artifact@v4
        with:
          name: harbour-whatsapp-i486-rpm
          path: release-rpms

      - name: RPMs auflisten
        run: ls -lh release-rpms/

      - name: Release Notes generieren
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          cat > release_notes.md << NOTES
          ## 📦 Installation

          ### Schritt 1 — Abhängigkeiten installieren

          Öffne das Terminal auf deinem Sailfish-Gerät und führe folgendes aus:

          \`\`\`bash
          pkcon install qt5-qtwebview nemo-qml-plugin-dbus-qt5 nemo-qml-plugin-notifications-qt5 python3 python3-dbus
          \`\`\`

          > **Tipp:** Die meisten dieser Pakete sind auf aktuellen Sailfish-Versionen bereits vorinstalliert.
          > Wenn ein Paket nicht gefunden wird, ist es wahrscheinlich schon vorhanden.

          ### Schritt 2 — Richtige RPM für dein Gerät wählen

          | Datei | Gerät |
          |-------|-------|
          | \`harbour-whatsapp-*-aarch64.rpm\` | Xperia 10 II / III / IV / V, Xperia 1 II/III, andere moderne 64-bit Geräte |
          | \`harbour-whatsapp-*-armv7hl.rpm\` | Jolla 1, Xperia X, Xperia XA2, ältere 32-bit ARM-Geräte |
          | \`harbour-whatsapp-*-i486.rpm\` | Sailfish OS Emulator / SDK |

          ### Schritt 3 — RPM installieren

          **Option A: Terminal**
          \`\`\`bash
          pkcon install-local harbour-whatsapp-${VERSION}-1.<arch>.rpm
          \`\`\`

          **Option B: Datei-Manager**
          RPM auf das Gerät kopieren → im Datei-Manager antippen → installieren.

          ### Schritt 4 — Beim ersten Start

          1. App öffnen
          2. QR-Code mit deinem Handy scannen (WhatsApp → Verknüpfte Geräte → Gerät verknüpfen)
          3. Fertig! Die Session bleibt dauerhaft gespeichert.

          ---

          ## 🔔 Hintergrund-Benachrichtigungen

          Der Daemon wird beim ersten Start automatisch als systemd-User-Service eingerichtet.
          Falls Benachrichtigungen nicht funktionieren:

          \`\`\`bash
          systemctl --user status harbour-whatsapp-daemon
          systemctl --user restart harbour-whatsapp-daemon
          # Logs anzeigen:
          journalctl --user -u harbour-whatsapp-daemon -f
          \`\`\`

          ---

          ## ❌ Deinstallieren

          \`\`\`bash
          pkcon remove harbour-whatsapp
          \`\`\`
          NOTES
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Release erstellen und RPMs hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: "harbour-whatsapp ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release-rpms/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
