name: Build RPM

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Neuestes verfügbares SDK-Image
  # https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags
  SFOS_RELEASE: 5.0.0.43
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, armv7hl, i486 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: RPMS-Verzeichnis anlegen
        run: mkdir -p RPMS

      - name: Build ${{ matrix.arch }} mit Sailfish SDK ${{ env.SFOS_RELEASE }}
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch:    ${{ matrix.arch }}

      - name: RPMs auflisten
        run: ls -lh RPMS/

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: harbour-whatsapp-${{ matrix.arch }}-rpm
          path: RPMS/*.rpm
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release erstellen
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Artefakte herunterladen (aarch64)
        uses: actions/download-artifact@v8
        with:
          name: harbour-whatsapp-aarch64-rpm
          path: release-rpms

      - name: Artefakte herunterladen (armv7hl)
        uses: actions/download-artifact@v8
        with:
          name: harbour-whatsapp-armv7hl-rpm
          path: release-rpms

      - name: Artefakte herunterladen (i486)
        uses: actions/download-artifact@v8
        with:
          name: harbour-whatsapp-i486-rpm
          path: release-rpms

      - name: RPMs auflisten
        run: ls -lh release-rpms/

      - name: Release erstellen und RPMs hochladen
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-rpms/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
